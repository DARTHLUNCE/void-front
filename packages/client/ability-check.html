<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ability VFX • Void Front</title>
<style>
:root{color-scheme:dark;--bg:#080d13;--panel:#111b25;--text:#dce9f2;--muted:#a6b8c6;--line:#344653;--focus:#75bfe7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:16px}header{display:flex;align-items:baseline;justify-content:space-between;gap:16px}h1{font-size:22px;margin:0 0 12px}a{color:var(--focus)}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:12px}button,select{font:inherit;padding:8px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:2px}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:3px}button:disabled{opacity:.5}.controls label{display:flex;gap:8px;align-items:center}#stage{width:100%;height:min(68vh,780px);min-height:260px;border:1px solid var(--line);position:relative}#stage canvas{display:block}#status,#detail{color:var(--muted);min-height:20px;line-height:1.6}#sheet{width:100%;height:auto;display:block;margin-top:16px}#sheet:empty{display:none}@media(max-width:520px){main{padding:8px}.controls label{width:100%}select{min-width:0;flex:1}header{align-items:center}h1{font-size:18px}}
</style></head><body><main><header><h1>Right-click ability effects</h1><a href="/">Back to game</a></header>
<div class="controls"><label>Ability <select id="ability" disabled></select></label><label>Team <select id="team"><option value="0">Cobalt</option><option value="1">Ember</option></select></label><label>Speed <select id="speed"><option value="1">1×</option><option value="0.5" selected>0.5× review</option><option value="0.25">0.25×</option></select></label><button id="replay" disabled>Replay</button><button id="pause" disabled>Pause</button><button id="inspect" disabled>Inspect animation</button><button id="materials" disabled>Inspect materials</button><button id="capture" disabled>Render all 27</button><button id="still" disabled>Save current frame</button><a id="download" hidden download="ability-vfx-sheet.png">Download sheet</a></div>
<div id="stage" role="img" aria-label="Live ability animation with production ship lighting and bloom"></div><p id="status" role="status">Loading production renderer and ship materials…</p><p id="detail"></p><pre id="material-results" style="white-space:pre-wrap;color:#a6b8c6"></pre><canvas id="sheet" width="0" height="0" aria-label="All 27 abilities, three variants per class"></canvas>
</main><script type="module" src="/src/ability-check.ts"></script></body></html>
