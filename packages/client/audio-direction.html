<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Void Front — recorded-material auditions</title>
<style>body{margin:0;background:#0b0e13;color:#d6dce5;font:16px system-ui;padding:32px;max-width:1200px}h1{font-size:25px}p{color:#acb9c7;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}article{padding:20px;background:#141b24;border:1px solid #344052}h2{font-size:17px;color:#f0c892;margin-top:0}audio{width:100%;margin:12px 0}small{color:#8499ac}a{color:#83c6e6}button{padding:10px;background:#263442;border:1px solid #516779;color:white;margin-bottom:16px;cursor:pointer}</style>
<h1>Recording-led sound redesign</h1><p>Current production sounds: recorded mechanisms, atonal firing attacks and processed abilities, heard without the battle mix. Each card has two takes. Use the Audio Lab for sustained playback and spatial mixing.</p><button id="stop">Stop all</button> <a href="/">Back to game</a><div class="grid" id="cues"></div>
<script type="module">
const bank=await(await fetch('/assets/audio-v4/manifest.json')).json();
const root=document.getElementById('cues');
for(const id of ['weapon.patrol','weapon.destroyer','weapon.dreadnought','engine.corvette','engine.battleship','ability.corvette.specterAmbush','ability.frigate.wardenTether','ability.dreadnought.eventHorizon']){const cue=bank[id];const a=document.createElement('article');const h=document.createElement('h2');h.textContent=cue.label;const p=document.createElement('p');p.textContent=cue.description;a.append(h,p);for(const file of cue.files.slice(0,2)){const sound=document.createElement('audio');sound.controls=true;sound.preload='none';sound.src='/assets/audio-v4/'+file;sound.volume=.65;sound.addEventListener('play',()=>{for(const other of document.querySelectorAll('audio'))if(other!==sound)other.pause()});a.append(sound)}const s=document.createElement('small');s.textContent='Recorded materials: '+cue.sources.join(', ');a.append(s);root.append(a)}
document.getElementById('stop').onclick=()=>document.querySelectorAll('audio').forEach(a=>{a.pause();a.currentTime=0});
</script></html>
